# Crea issues de la actividad para repos creados desde GitHub Classroom.
# Idempotente: crea solamente los issues faltantes por titulo.
name: Setup assignment issues

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: setup-issues-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ensure-assignment-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Crear issues faltantes de la actividad
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json
          import os
          import textwrap
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GITHUB_TOKEN"]
          API = "https://api.github.com"
          ISSUE_LABEL = "classroom-assignment"

          ISSUES = [
              {
                  "title": "[Entrega] Vincular CSS y JS al HTML",
                  "body": """
          ## Objetivo
          Conectar la hoja de estilos y el script de JavaScript al archivo `index.html` para que la página funcione correctamente.

          ## Qué debe cumplirse
          - [ ] Dentro de `<head>`, existe una etiqueta `<link>` que vincula `css/styles.css`.
          - [ ] Antes del cierre de `</body>`, existe una etiqueta `<script>` que vincula `js/index.js`.

          ## Commit sugerido
          ```
          feat(html): vincular css y script js al html

          Closes #1
          ```""",
              },
              {
                  "title": "[Requisito] Realizar la petición a la API con fetch",
                  "body": """
          ## Objetivo
          Usar JavaScript para realizar una petición HTTP a la API de usuarios usando `fetch()` o `async/await`.

          ## Qué debe cumplirse
          - [ ] En `js/index.js`, realizar una consulta a la API (`http://localhost:3000/api/user` o `https://randomuser.me/api/`).
          - [ ] Convertir la respuesta a formato JSON (`response.json()`).
          - [ ] Pasar los datos recibidos a la función `renderizarDatosUsuario(datos)`.

          ## Commit sugerido
          ```
          feat(js): consumir api de usuarios con fetch

          Closes #2
          ```""",
              },
              {
                  "title": "[Requisito] Renderizar los datos del usuario en la tarjeta",
                  "body": """
          ## Objetivo
          Desarrollar la función `renderizarDatosUsuario(datos)` para mostrar la foto, nombre completo e email del usuario dentro del contenedor `div.tarjeta`.

          ## Qué debe cumplirse
          - [ ] Seleccionar el contenedor `div.tarjeta` usando `document.querySelector('.tarjeta')` o similar.
          - [ ] Crear e insertar la imagen del usuario (`picture.large` o `picture.medium`).
          - [ ] Crear e insertar el nombre completo (`title`, `first`, `last`).
          - [ ] Crear e insertar el correo electrónico (`email`).

          ## Commit sugerido
          ```
          feat(js): renderizar foto nombre e email en el dom

          Closes #3
          ```""",
              },
              {
                  "title": "[Requisito] Implementar botón Pedir random",
                  "body": """
          ## Objetivo
          Descomentar el botón en `index.html` y permitir obtener un nuevo usuario al hacer clic en él sin recargar la página.

          ## Qué debe cumplirse
          - [ ] En `index.html`, descomentar el contenedor `<div class="btnContainer">` con el botón `#random`.
          - [ ] En `js/index.js`, desarrollar la función `cargarUsuario()` o asignar un listener al evento `click` del botón.
          - [ ] Al hacer clic, solicitar un nuevo usuario a la API y actualizar la tarjeta en el DOM.

          ## Commit sugerido
          ```
          feat(js): agregar evento al boton random para actualizar usuario

          Closes #4
          ```""",
              },
              {
                  "title": "[Revisión docente] Resultado visual y comportamiento dinámico",
                  "body": """
          ## Objetivo
          Completar la corrección más allá de los tests automáticos.

          ## Checklist sugerida para el docente
          - [ ] La tarjeta muestra correctamente la foto, nombre completo e email del usuario.
          - [ ] Al presionar el botón "Pedir random", el usuario en pantalla cambia dinámicamente.
          - [ ] El código JavaScript es limpio, legible y maneja adecuadamente las promesas/async-await.

          ## Commit sugerido
          ```
          chore: entrega lista para revision docente

          Closes #5
          ```""",
              },
          ]

          for _spec in ISSUES:
              _spec["body"] = textwrap.dedent(_spec["body"]).strip()

          def request(method, url, data=None):
              headers = {
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              body = None
              if data is not None:
                  headers["Content-Type"] = "application/json; charset=utf-8"
                  body = json.dumps(data).encode("utf-8")
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode())

          def list_existing_issue_titles():
              titles = set()
              page = 1
              while True:
                  url = f"{API}/repos/{REPO}/issues?state=all&per_page=100&page={page}"
                  headers = {
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      batch = json.loads(resp.read().decode())
                  if not batch:
                      break
                  for item in batch:
                      if item.get("pull_request") is None:
                          title = item.get("title", "").strip()
                          if title:
                              titles.add(title)
                  if len(batch) < 100:
                      break
                  page += 1
              return titles

          def ensure_label_exists(label_name):
              url = f"{API}/repos/{REPO}/labels/{urllib.parse.quote(label_name)}"
              try:
                  request("GET", url)
                  return
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              request(
                  "POST",
                  f"{API}/repos/{REPO}/labels",
                  {
                      "name": label_name,
                      "color": "1d76db",
                      "description": "Issue generado automaticamente para la actividad de Classroom",
                  },
              )
              print(f"Etiqueta creada: {label_name}")

          existing_titles = list_existing_issue_titles()
          ensure_label_exists(ISSUE_LABEL)

          created_count = 0
          skipped_count = 0
          for spec in ISSUES:
              if spec["title"] in existing_titles:
                  skipped_count += 1
                  print("Ya existe, se omite: " + spec["title"])
                  continue
              url = f"{API}/repos/{REPO}/issues"
              created = request(
                  "POST",
                  url,
                  {"title": spec["title"], "body": spec["body"], "labels": [ISSUE_LABEL]},
              )
              created_count += 1
              print("Creado issue #" + str(created["number"]) + ": " + spec["title"])
          print(
              "Listo: "
              + str(created_count)
              + " issue(s) creado(s), "
              + str(skipped_count)
              + " ya existentes."
          )
          PY
